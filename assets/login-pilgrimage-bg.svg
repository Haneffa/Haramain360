<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052b25"/><stop offset=".52" stop-color="#0b5a47"/><stop offset="1" stop-color="#062d26"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#b7d8b2" stop-opacity=".65"/><stop offset="1" stop-color="#b7d8b2" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold"><stop stop-color="#f3d77b"/><stop offset="1" stop-color="#b78a2c"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<circle cx="380" cy="260" r="260" fill="url(#glow)" filter="url(#blur)"/>
<circle cx="1240" cy="260" r="300" fill="url(#glow)" filter="url(#blur)"/>
